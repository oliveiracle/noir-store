  <!-- Chat widget (fixed) -->
  <circle cx="358" cy="826" r="16" fill="#D0CEC8" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="358" y="830" font-size="6.5" fill="#888" text-anchor="middle">chat</text>
  <!-- annotation chat fixed -->
  <line x1="358" y1="810" x2="358" y2="796" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="270" y="782" width="116" height="12" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="328" y="792" font-size="6.5" fill="#666" text-anchor="middle">Fixed chat widget</text>

  <!-- =====================
       BOTTOM LABEL
  ===================== -->
  <line x1="8" y1="900" x2="382" y2="900" stroke="#CCC" stroke-width="0.4"/>
  <text x="8" y="912" font-size="8" fill="#AAAAAA">Page M-01 / Mobile — Shop All Products</text>
  <text x="382" y="912" font-size="8" fill="#AAAAAA" text-anchor="end">390×844px viewport</text>
