<svg viewBox="0 0 390 1600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="monospace" style="background:#F4F2ED;">
  <title>Wireframe – NOIR Mobile / Shop All Products</title>
  <rect width="390" height="1600" fill="#F4F2ED"/>

