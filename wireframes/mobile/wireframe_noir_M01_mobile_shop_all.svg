  <text x="8" y="696" font-size="8.5" fill="#444" font-weight="bold">JACKET</text>
  <text x="8" y="712" font-size="8" fill="#777">€349.99</text>

  <!-- Card 2 -->
  <rect x="197" y="408" width="185" height="260" fill="#C8C5BE" rx="2" stroke="#AAAAAA" stroke-width="0.6"/>
  <line x1="197" y1="408" x2="382" y2="668" stroke="#BBB" stroke-width="0.4"/>
  <line x1="382" y1="408" x2="197" y2="668" stroke="#BBB" stroke-width="0.4"/>
  <text x="289" y="542" font-size="7.5" fill="#888" text-anchor="middle">PRODUCT IMAGE</text>
  <!-- info below -->
  <text x="197" y="682" font-size="8.5" fill="#444" font-weight="bold">SLIM WOOL OVERCOAT</text>
