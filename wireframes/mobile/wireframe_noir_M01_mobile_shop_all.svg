  <text x="148" y="742" font-size="6.5" fill="#666" text-anchor="middle">2-col grid: image | name bold | price — stacked vertically</text>

  <!-- PRODUCT GRID ROW 2 — partially cut off (scroll) -->
  <rect x="8" y="752" width="185" height="116" fill="#BDB9B2" rx="2" stroke="#AAAAAA" stroke-width="0.5" stroke-dasharray="3,2"/>
  <rect x="18" y="762" width="32" height="16" fill="#F4F2ED" rx="1" stroke="#AAA" stroke-width="0.7"/>
  <text x="34" y="773" font-size="6.5" fill="#555" text-anchor="middle">NEW</text>
  <text x="100" y="816" font-size="7" fill="#AAA" text-anchor="middle">IMAGE</text>

  <rect x="197" y="752" width="185" height="116" fill="#BDB9B2" rx="2" stroke="#AAAAAA" stroke-width="0.5" stroke-dasharray="3,2"/>
  <rect x="207" y="762" width="32" height="16" fill="#F4F2ED" rx="1" stroke="#AAA" stroke-width="0.7"/>
  <text x="223" y="773" font-size="6.5" fill="#555" text-anchor="middle">NEW</text>
  <text x="289" y="816" font-size="7" fill="#AAA" text-anchor="middle">IMAGE</text>

  <!-- scroll hint -->
