  <!-- annotation empty state -->
  <line x1="170" y1="192" x2="230" y2="178" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="232" y="168" width="142" height="20" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="303" y="177" font-size="6.5" fill="#666" text-anchor="middle">Empty state message — no icon</text>
  <text x="303" y="185" font-size="6.5" fill="#777" text-anchor="middle">plain body text, muted</text>

  <!-- CONTINUE SHOPPING link -->
  <text x="24" y="232" font-size="8.5" fill="#666" letter-spacing="2" font-weight="bold">← CONTINUE SHOPPING</text>
  <line x1="24" y1="236" x2="218" y2="236" stroke="#666" stroke-width="0.6"/>
  <!-- annotation -->
  <line x1="218" y1="232" x2="268" y2="220" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="200" y="210" width="174" height="20" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="287" y="219" font-size="6.5" fill="#444" text-anchor="middle" font-weight="bold">← CONTINUE SHOPPING — caps, bold</text>
  <text x="287" y="227" font-size="6.5" fill="#777" text-anchor="middle">primary action on empty cart</text>

  <!-- divider -->
  <line x1="8" y1="322" x2="382" y2="322" stroke="#C0BDB6" stroke-width="0.8"/>

