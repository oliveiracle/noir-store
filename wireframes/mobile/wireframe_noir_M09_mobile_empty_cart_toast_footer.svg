  <text x="195" y="604" font-size="7.5" fill="#999" text-anchor="middle" letter-spacing="0.5">© 2026 NOIR. ALL RIGHTS RESERVED.</text>
  <!-- annotation copyright -->
  <line x1="195" y1="610" x2="195" y2="624" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="78" y="626" width="234" height="14" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="195" y="637" font-size="6.5" fill="#666" text-anchor="middle">Copyright bar — centered, caps, appears on mobile footer</text>

  <!-- Extra spacing below footer -->
  <rect x="8" y="758" width="374" height="110" fill="#E0DDD6" stroke="none"/>
  <text x="195" y="818" font-size="7" fill="#CCC" text-anchor="middle">extra space below footer — matches screenshot</text>

  <!-- Chat widget -->
  <circle cx="358" cy="808" r="16" fill="#D0CEC8" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="358" y="812" font-size="6.5" fill="#888" text-anchor="middle">chat</text>

  <!-- viewport bottom -->
  <line x1="8" y1="836" x2="382" y2="836" stroke="#AAAAAA" stroke-width="0.6" stroke-dasharray="3,3"/>
  <text x="195" y="850" font-size="6.5" fill="#BBB" text-anchor="middle">— bottom of viewport (844px) —</text>

  <!-- bottom label -->
  <line x1="8" y1="876" x2="382" y2="876" stroke="#CCC" stroke-width="0.4"/>
  <text x="8" y="888" font-size="8" fill="#AAAAAA">Page M-09 / Mobile — Empty Cart + Toast + Footer</text>
  <text x="382" y="888" font-size="8" fill="#AAAAAA" text-anchor="end">390×844px viewport</text>
