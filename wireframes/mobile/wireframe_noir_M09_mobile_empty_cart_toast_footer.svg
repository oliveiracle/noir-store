  <rect x="80" y="308" width="230" height="14" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="195" y="319" font-size="6.5" fill="#666" text-anchor="middle">Footer — 2-col on mobile (SHOP + HELP side by side)</text>

  <line x1="24" y1="374" x2="366" y2="374" stroke="#BBBAB3" stroke-width="0.4"/>

