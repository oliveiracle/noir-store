  <text x="148" y="553" font-size="8" fill="#AAA" text-anchor="middle">your@email.com</text>
  <rect x="278" y="532" width="88" height="34" fill="#B0ADA6" rx="2" stroke="#999" stroke-width="0.8"/>
  <text x="322" y="553" font-size="8.5" fill="#555" text-anchor="middle" font-weight="bold">JOIN</text>
  <!-- annotation newsletter -->
  <line x1="322" y1="532" x2="322" y2="516" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="200" y="500" width="164" height="16" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="282" y="511" font-size="6.5" fill="#666" text-anchor="middle">Newsletter full-width on mobile — input + JOIN</text>

