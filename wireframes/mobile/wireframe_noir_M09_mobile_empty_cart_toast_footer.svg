  <rect x="24" y="406" width="80" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="24" y="422" width="72" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="24" y="438" width="50" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="24" y="454" width="60" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="24" y="470" width="80" height="10" fill="#C8C5BE" rx="1"/>
  <text x="64" y="415" font-size="7" fill="#888" text-anchor="middle">Jackets</text>
  <text x="60" y="431" font-size="7" fill="#888" text-anchor="middle">Trousers</text>
  <text x="49" y="447" font-size="7" fill="#888" text-anchor="middle">Shirts</text>
  <text x="54" y="463" font-size="7" fill="#888" text-anchor="middle">T-Shirts</text>
  <text x="64" y="479" font-size="7" fill="#888" text-anchor="middle">Accessories</text>

  <!-- HELP column -->
  <text x="200" y="396" font-size="8" fill="#777" letter-spacing="2" font-weight="bold">HELP</text>
  <rect x="200" y="406" width="50" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="200" y="422" width="36" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="200" y="438" width="60" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="200" y="454" width="55" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="200" y="470" width="55" height="10" fill="#C8C5BE" rx="1"/>
  <text x="225" y="415" font-size="7" fill="#888" text-anchor="middle">About</text>
  <text x="218" y="431" font-size="7" fill="#888" text-anchor="middle">FAQ</text>
  <text x="230" y="447" font-size="7" fill="#888" text-anchor="middle">Shipping</text>
  <text x="227" y="463" font-size="7" fill="#888" text-anchor="middle">Returns</text>
  <text x="227" y="479" font-size="7" fill="#888" text-anchor="middle">Contact</text>

  <!-- annotation 2-col layout -->
  <line x1="200" y1="440" x2="310" y2="428" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="212" y="412" width="162" height="20" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="293" y="421" font-size="6.5" fill="#666" text-anchor="middle">Desktop: 4 cols (logo+shop+help+newsletter)</text>
  <text x="293" y="429" font-size="6.5" fill="#777" text-anchor="middle">Mobile: 2 cols (shop | help) stacked below logo</text>

  <!-- NEWSLETTER section — full width on mobile -->
  <line x1="24" y1="502" x2="366" y2="502" stroke="#BBBAB3" stroke-width="0.4"/>
