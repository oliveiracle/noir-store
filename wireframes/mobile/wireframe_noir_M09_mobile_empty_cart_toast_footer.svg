  <!-- STATUS BAR -->
  <rect x="8" y="24" width="374" height="28" fill="#D8D6CF" rx="8"/>
  <rect x="8" y="40" width="374" height="12" fill="#D8D6CF"/>
  <text x="28" y="42" font-size="7" fill="#777">9:41</text>
  <text x="362" y="42" font-size="7" fill="#777" text-anchor="end">●●●</text>

  <!-- NAVBAR -->
  <rect x="8" y="52" width="374" height="52" fill="#DEDAD3" stroke="#C0BEB8" stroke-width="0.6"/>
  <rect x="22" y="64" width="52" height="16" fill="#C8C6BF" rx="2"/>
  <text x="48" y="75" font-size="7.5" fill="#666" text-anchor="middle">LOGO</text>
  <circle cx="298" cy="78" r="9" fill="none" stroke="#AAAAAA" stroke-width="1.1"/>
  <text x="298" y="82" font-size="6" fill="#888" text-anchor="middle">acct</text>
  <circle cx="324" cy="78" r="9" fill="none" stroke="#AAAAAA" stroke-width="1.1"/>
  <circle cx="332" cy="70" r="5.5" fill="#777"/>
  <text x="332" y="73.5" font-size="5" fill="#F4F2ED" text-anchor="middle">0</text>
  <rect x="348" y="71" width="18" height="2" fill="#777" rx="1"/>
  <rect x="348" y="77" width="18" height="2" fill="#777" rx="1"/>
  <rect x="348" y="83" width="18" height="2" fill="#777" rx="1"/>

  <!-- =====================
       TOAST NOTIFICATION — fixed top, overlaps content
  ===================== -->
  <rect x="32" y="108" width="330" height="48" fill="#D6EEF0" rx="8" stroke="#A8D4D9" stroke-width="1.2"/>
  <!-- subtle shadow -->
  <rect x="34" y="110" width="330" height="48" fill="#A8D4D9" rx="8" opacity="0.15"/>
  <text x="220" y="137" font-size="9" fill="#2D7A84" text-anchor="middle">You&#39;re already subscribed.</text>
  <!-- X close button -->
  <circle cx="348" cy="132" r="10" fill="none" stroke="#A8D4D9" stroke-width="1"/>
  <text x="348" y="136" font-size="10" fill="#2D7A84" text-anchor="middle">×</text>

  <!-- Toast annotations -->
  <line x1="32" y1="132" x2="8" y2="120" stroke="#888" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="8" y="96" width="220" height="26" fill="#F4F2ED" rx="3" stroke="#888" stroke-width="0.7"/>
  <text x="118" y="107" font-size="6.5" fill="#444" text-anchor="middle" font-weight="bold">Toast notification — fixed/absolute top</text>
  <text x="118" y="116" font-size="6.5" fill="#777" text-anchor="middle">Light blue bg · dismissable with × · auto-hides ~3s</text>

  <line x1="348" y1="132" x2="382" y2="120" stroke="#888" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="248" y="84" width="134" height="20" fill="#F4F2ED" rx="2" stroke="#888" stroke-width="0.7"/>
  <text x="315" y="93" font-size="6.5" fill="#444" text-anchor="middle" font-weight="bold">Close button (×)</text>
  <text x="315" y="101" font-size="6.5" fill="#777" text-anchor="middle">JS dismisses toast on click</text>

