<svg width="390" height="1300" viewBox="0 0 390 1300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="monospace" style="background:#F4F2ED;">
  <title>Wireframe – NOIR Mobile / Empty Cart + Toast + Footer</title>
  <rect width="390" height="1300" fill="#F4F2ED"/>

  <text x="8" y="14" font-size="8" fill="#888" letter-spacing="1">WIREFRAME — NOIR / MOBILE — EMPTY CART + TOAST NOTIFICATION + FOOTER</text>
  <line x1="8" y1="19" x2="382" y2="19" stroke="#CCC" stroke-width="0.4"/>

  <!-- SCREEN BORDER 390x844 -->
