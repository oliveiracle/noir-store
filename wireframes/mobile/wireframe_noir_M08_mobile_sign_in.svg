<svg viewBox="0 0 390 1200" xmlns="http://www.w3.org/2000/svg" role="img" font-family="monospace" style="background:#F4F2ED;">
  <title>Wireframe – NOIR Mobile / Sign In</title>
  <rect width="390" height="1200" fill="#F4F2ED"/>

  <text x="8" y="14" font-size="8" fill="#888" letter-spacing="1">WIREFRAME — NOIR / MOBILE — SIGN IN PAGE</text>
  <line x1="8" y1="19" x2="382" y2="19" stroke="#CCC" stroke-width="0.4"/>

  <!-- SCREEN BORDER 390x844 -->
  <rect x="8" y="24" width="374" height="844" fill="#E8E6E0" rx="8" stroke="#AAAAAA" stroke-width="1.2"/>

  <!-- STATUS BAR -->
  <rect x="8" y="24" width="374" height="28" fill="#D8D6CF" rx="8"/>
  <rect x="8" y="40" width="374" height="12" fill="#D8D6CF"/>
  <text x="28" y="42" font-size="7" fill="#777">9:41</text>
  <text x="362" y="42" font-size="7" fill="#777" text-anchor="end">●●●</text>

  <!-- NAVBAR -->
  <rect x="8" y="52" width="374" height="52" fill="#DEDAD3" stroke="#C0BEB8" stroke-width="0.6"/>
  <rect x="22" y="64" width="52" height="16" fill="#C8C6BF" rx="2"/>
  <text x="48" y="75" font-size="7.5" fill="#666" text-anchor="middle">LOGO</text>
  <circle cx="298" cy="78" r="9" fill="none" stroke="#AAAAAA" stroke-width="1.1"/>
  <text x="298" y="82" font-size="6" fill="#888" text-anchor="middle">acct</text>
  <circle cx="324" cy="78" r="9" fill="none" stroke="#AAAAAA" stroke-width="1.1"/>
  <circle cx="332" cy="70" r="5.5" fill="#777"/>
  <text x="332" y="73.5" font-size="5" fill="#F4F2ED" text-anchor="middle">0</text>
  <rect x="348" y="71" width="18" height="2" fill="#777" rx="1"/>
  <rect x="348" y="77" width="18" height="2" fill="#777" rx="1"/>
  <rect x="348" y="83" width="18" height="2" fill="#777" rx="1"/>

  <!-- MAIN CONTENT -->
  <rect x="8" y="104" width="374" height="740" fill="#E8E6E0" stroke="#C0BEB8" stroke-width="0.6"/>

  <!-- Top spacing -->
  <rect x="8" y="104" width="374" height="130" fill="#E2E0D9"/>
  <text x="195" y="172" font-size="7" fill="#CCC" text-anchor="middle">top spacing — ~130px, no hero</text>
  <!-- annotation -->
  <line x1="195" y1="164" x2="195" y2="148" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="78" y="134" width="234" height="14" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="195" y="145" font-size="6.5" fill="#666" text-anchor="middle">Mobile: no centered column — form is full-width with side padding</text>

  <!-- Breadcrumb -->
  <text x="24" y="256" font-size="7.5" fill="#999" letter-spacing="1.5">NOIR / ACCOUNT</text>

  <!-- Page title -->
  <rect x="24" y="266" width="190" height="42" fill="#C0BDB6" rx="3"/>
  <text x="119" y="294" font-size="16" fill="#555" text-anchor="middle" font-weight="bold">SIGN IN</text>
  <!-- annotation title -->
  <line x1="214" y1="287" x2="268" y2="274" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="202" y="256" width="172" height="20" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="288" y="265" font-size="6.5" fill="#666" text-anchor="middle">Title single line — display bold ~28px</text>
  <text x="288" y="273" font-size="6.5" fill="#777" text-anchor="middle">Desktop centered, mobile left-aligned</text>

  <!-- FIELD 1: USERNAME OR EMAIL -->
  <text x="24" y="338" font-size="7.5" fill="#777" letter-spacing="2">USERNAME OR EMAIL</text>
  <rect x="24" y="346" width="342" height="32" fill="#D8D6CF" rx="2" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="38" y="366" font-size="8.5" fill="#AAA">Username or email</text>
  <line x1="24" y1="378" x2="366" y2="378" stroke="#999" stroke-width="0.8"/>
  <!-- annotation -->
  <line x1="366" y1="362" x2="382" y2="350" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="210" y="328" width="172" height="20" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="296" y="337" font-size="6.5" fill="#666" text-anchor="middle">Underline input — full viewport width</text>
  <text x="296" y="345" font-size="6.5" fill="#777" text-anchor="middle">minus 24px padding each side</text>

  <!-- FIELD 2: PASSWORD -->
  <text x="24" y="408" font-size="7.5" fill="#777" letter-spacing="2">PASSWORD</text>
  <rect x="24" y="416" width="342" height="32" fill="#D8D6CF" rx="2" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="38" y="436" font-size="8.5" fill="#AAA">Password</text>
  <line x1="24" y1="448" x2="366" y2="448" stroke="#999" stroke-width="0.8"/>

  <!-- REMEMBER ME checkbox -->
  <rect x="24" y="466" width="14" height="14" fill="none" rx="2" stroke="#888" stroke-width="1.2"/>
  <text x="46" y="478" font-size="8" fill="#888" letter-spacing="1.5">REMEMBER ME</text>
  <!-- annotation checkbox -->
  <line x1="160" y1="473" x2="210" y2="460" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="212" y="452" width="160" height="20" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="292" y="461" font-size="6.5" fill="#666" text-anchor="middle">Checkbox — unchecked default state</text>
  <text x="292" y="469" font-size="6.5" fill="#777" text-anchor="middle">label in caps, letter-spaced</text>

  <!-- SIGN IN CTA -->
  <rect x="24" y="494" width="342" height="50" fill="#C8C5BE" rx="2" stroke="#888" stroke-width="1.2"/>
  <text x="195" y="524" font-size="10" fill="#444" text-anchor="middle" letter-spacing="3" font-weight="bold">SIGN IN</text>
  <!-- annotation -->
  <line x1="24" y1="519" x2="8" y2="508" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="8" y="482" width="186" height="26" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="101" y="493" font-size="6.5" fill="#444" text-anchor="middle" font-weight="bold">Primary CTA — full-width, light fill, caps</text>
  <text x="101" y="502" font-size="6.5" fill="#777" text-anchor="middle">Desktop: ~400px centered column</text>
  <text x="101" y="510" font-size="6.5" fill="#777" text-anchor="middle">Mobile: full viewport width</text>

  <!-- Secondary links -->
  <text x="24" y="566" font-size="9" fill="#888">Forgot your password?</text>
  <text x="24" y="590" font-size="9" fill="#888">New here? Create an account →</text>
  <!-- annotation links -->
  <line x1="220" y1="578" x2="268" y2="566" stroke="#AAAAAA" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="202" y="548" width="172" height="20" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="288" y="557" font-size="6.5" fill="#666" text-anchor="middle">Secondary links — body light, muted</text>
  <text x="288" y="565" font-size="6.5" fill="#777" text-anchor="middle">→ arrow on register link</text>

  <!-- Large empty space -->
  <rect x="24" y="614" width="342" height="168" fill="#E2E0D9" rx="2" stroke="#C8C5BE" stroke-width="0.4" stroke-dasharray="4,3"/>
  <text x="195" y="700" font-size="7.5" fill="#CCC" text-anchor="middle">empty space — form fits above fold</text>

  <!-- FOOTER partial -->
  <rect x="8" y="796" width="374" height="72" fill="#D8D6CF" stroke="#BBBAB3" stroke-width="0.6"/>
  <rect x="22" y="810" width="52" height="16" fill="#C0BDB6" rx="2"/>
  <text x="48" y="821" font-size="7.5" fill="#666" text-anchor="middle">LOGO</text>
  <text x="90" y="821" font-size="7.5" fill="#888">Premium menswear. No excess. No noise.</text>

  <!-- viewport bottom -->
  <line x1="8" y1="836" x2="382" y2="836" stroke="#AAAAAA" stroke-width="0.6" stroke-dasharray="3,3"/>
  <text x="195" y="850" font-size="6.5" fill="#BBB" text-anchor="middle">— bottom of viewport (844px) —</text>

  <!-- Chat widget -->
  <circle cx="358" cy="820" r="16" fill="#D0CEC8" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="358" y="824" font-size="6.5" fill="#888" text-anchor="middle">chat</text>

  <!-- Desktop vs Mobile comparison -->
  <rect x="8" y="876" width="374" height="60" fill="#F4F2ED" rx="4" stroke="#BBBAB3" stroke-width="0.8"/>
  <text x="195" y="894" font-size="7.5" fill="#444" text-anchor="middle" font-weight="bold">MOBILE vs DESKTOP DIFFERENCE</text>
  <line x1="24" y1="900" x2="366" y2="900" stroke="#CCC" stroke-width="0.4"/>
  <text x="195" y="914" font-size="6.5" fill="#666" text-anchor="middle">Desktop: form centered in ~400px column with negative space on both sides</text>
  <text x="195" y="926" font-size="6.5" fill="#777" text-anchor="middle">Mobile: full-width form, left-aligned title, no centering — no layout shift needed</text>

  <!-- bottom label -->
  <line x1="8" y1="950" x2="382" y2="950" stroke="#CCC" stroke-width="0.4"/>
  <text x="8" y="962" font-size="8" fill="#AAAAAA">Page M-08 / Mobile — Sign In</text>
  <text x="382" y="962" font-size="8" fill="#AAAAAA" text-anchor="end">390×844px viewport</text>
</svg>