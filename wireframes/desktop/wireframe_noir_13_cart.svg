<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" font-family="monospace" style="background:#F4F2ED;">
  <title>Wireframe – NOIR Cart / Bag Page</title>
  <rect width="1200" height="900" fill="#F4F2ED"/>
  <text x="20" y="22" font-size="11" fill="#888" letter-spacing="1.5">WIREFRAME — NOIR / CART PAGE</text>
  <line x1="20" y1="30" x2="1180" y2="30" stroke="#CCC" stroke-width="0.5"/>

  <!-- NAVBAR -->
  <rect x="20" y="42" width="1160" height="52" fill="#E0DDD6" rx="3" stroke="#BBBAB3" stroke-width="0.8"/>
  <rect x="40" y="58" width="70" height="18" fill="#C8C6BF" rx="2"/>
  <text x="75" y="71" font-size="9" fill="#666" text-anchor="middle">LOGO</text>
  <rect x="420" y="60" width="50" height="14" fill="#D8D6CF" rx="2"/>
  <text x="445" y="71" font-size="8" fill="#777" text-anchor="middle">SHOP</text>
  <rect x="485" y="60" width="50" height="14" fill="#D8D6CF" rx="2"/>
  <text x="510" y="71" font-size="8" fill="#777" text-anchor="middle">ABOUT</text>
  <rect x="550" y="60" width="60" height="14" fill="#D8D6CF" rx="2"/>
  <text x="580" y="71" font-size="8" fill="#777" text-anchor="middle">JACKETS</text>
  <rect x="625" y="60" width="70" height="14" fill="#D8D6CF" rx="2"/>
  <text x="660" y="71" font-size="8" fill="#777" text-anchor="middle">TROUSERS</text>
  <rect x="710" y="60" width="85" height="14" fill="#D8D6CF" rx="2"/>
  <text x="752" y="71" font-size="8" fill="#777" text-anchor="middle">ACCESSORIES</text>
  <rect x="1020" y="60" width="70" height="14" fill="#D8D6CF" rx="2"/>
  <text x="1055" y="71" font-size="8" fill="#777" text-anchor="middle">SEARCH</text>
  <circle cx="1115" cy="67" r="8" fill="none" stroke="#AAAAAA" stroke-width="1.2"/>
  <!-- Cart icon with badge = 2 -->
  <circle cx="1145" cy="67" r="8" fill="none" stroke="#AAAAAA" stroke-width="1.2"/>
  <circle cx="1152" cy="60" r="6" fill="#888"/>
  <text x="1152" y="64" font-size="6" fill="#F4F2ED" text-anchor="middle">2</text>
  <line x1="20" y1="96" x2="1180" y2="96" stroke="#C8C6BF" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- MAIN AREA -->
  <rect x="20" y="100" width="1160" height="400" fill="#E8E6E0" rx="3" stroke="#C0BEB8" stroke-width="0.8"/>

  <!-- Layout annotation: left items ~67%, right summary ~30% -->
  <line x1="980" y1="108" x2="980" y2="495" stroke="#BBBAB3" stroke-width="0.5" stroke-dasharray="4,4"/>
  <rect x="340" y="100" width="300" height="17" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.5"/>
  <text x="490" y="112" font-size="8" fill="#777" text-anchor="middle">Layout 2 col — cart items ~67% | order summary ~30%</text>

  <!-- ===== CART ITEM ROW ===== -->
  <!-- Thumbnail -->
  <rect x="40" y="148" width="90" height="120" fill="#C8C5BE" rx="2" stroke="#AAAAAA" stroke-width="0.6"/>
  <line x1="40" y1="148" x2="130" y2="268" stroke="#BBB" stroke-width="0.4"/>
  <line x1="130" y1="148" x2="40" y2="268" stroke="#BBB" stroke-width="0.4"/>
  <text x="85" y="213" font-size="7" fill="#AAA" text-anchor="middle">THUMB</text>
  <!-- annotation thumbnail -->
  <line x1="40" y1="208" x2="20" y2="220" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="0" y="0" width="0" height="0" fill="none"/>

  <!-- Item info -->
  <text x="144" y="170" font-size="8" fill="#888" letter-spacing="2">TROUSERS</text>
  <text x="144" y="190" font-size="11" fill="#555" font-weight="bold">TAILORED SLIM TROUSERS</text>
  <text x="144" y="208" font-size="9" fill="#777">€119.99</text>

  <!-- Qty stepper -->
  <rect x="144" y="222" width="26" height="26" fill="#D0CEC8" rx="2" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="157" y="239" font-size="10" fill="#666" text-anchor="middle">-</text>
  <rect x="174" y="222" width="40" height="26" fill="#C8C5BE" rx="2" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="194" y="239" font-size="9" fill="#666" text-anchor="middle">2</text>
  <rect x="218" y="222" width="26" height="26" fill="#D0CEC8" rx="2" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="231" y="239" font-size="10" fill="#666" text-anchor="middle">+</text>
  <rect x="252" y="222" width="60" height="26" fill="#D0CEC8" rx="2" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="282" y="239" font-size="8" fill="#666" text-anchor="middle">UPDATE</text>
  <!-- annotation qty -->
  <line x1="312" y1="235" x2="370" y2="220" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="372" y="208" width="220" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="482" y="223" font-size="8.5" fill="#666" text-anchor="middle">Qty stepper: − | input | + | UPDATE button</text>

  <!-- Line total + REMOVE -->
  <text x="940" y="172" font-size="11" fill="#555" text-anchor="end" font-weight="bold">€239.98</text>
  <text x="940" y="200" font-size="8" fill="#999" text-anchor="end" letter-spacing="1">REMOVE</text>
  <!-- annotation remove -->
  <line x1="940" y1="196" x2="960" y2="183" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="962" y="171" width="190" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="1057" y="186" font-size="8.5" fill="#666" text-anchor="middle">Line total + REMOVE link — right-aligned</text>

  <!-- divider between items -->
  <line x1="40" y1="282" x2="960" y2="282" stroke="#C8C5BE" stroke-width="0.5"/>
  <text x="500" y="320" font-size="8" fill="#CCC" text-anchor="middle">additional cart items repeat below...</text>

  <!-- ===== ORDER SUMMARY PANEL ===== -->
  <rect x="988" y="120" width="192" height="310" fill="#D8D6CF" rx="3" stroke="#BBBAB3" stroke-width="0.8"/>
  <text x="1084" y="148" font-size="8" fill="#777" letter-spacing="2" text-anchor="middle">ORDER SUMMARY</text>
  <line x1="1004" y1="156" x2="1164" y2="156" stroke="#BBBAB3" stroke-width="0.5"/>

  <text x="1004" y="178" font-size="8" fill="#888">SUBTOTAL</text>
  <text x="1164" y="178" font-size="8" fill="#666" text-anchor="end">€239.98</text>

  <text x="1004" y="202" font-size="8" fill="#888">SHIPPING</text>
  <text x="1164" y="202" font-size="8" fill="#888" text-anchor="end">Calculated at checkout</text>

  <line x1="1004" y1="218" x2="1164" y2="218" stroke="#BBBAB3" stroke-width="0.5"/>
  <text x="1004" y="238" font-size="9" fill="#555" font-weight="bold">TOTAL</text>
  <text x="1164" y="238" font-size="9" fill="#444" text-anchor="end" font-weight="bold">€239.98</text>

  <!-- Proceed to checkout CTA -->
  <rect x="1004" y="252" width="160" height="40" fill="#C8C5BE" rx="2" stroke="#888" stroke-width="1.2"/>
  <text x="1084" y="277" font-size="7.5" fill="#555" text-anchor="middle" letter-spacing="2">PROCEED TO CHECKOUT</text>
  <!-- annotation -->
  <line x1="1164" y1="272" x2="1186" y2="260" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="1010" y="226" width="170" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="1095" y="241" font-size="8" fill="#666" text-anchor="middle">Primary CTA — full width of panel</text>

  <!-- Continue shopping link -->
  <text x="1084" y="312" font-size="8" fill="#888" text-anchor="middle" letter-spacing="1">← CONTINUE SHOPPING</text>
  <line x1="1004" y1="318" x2="1164" y2="318" stroke="#C8C5BE" stroke-width="0.5"/>
  <line x1="1084" y1="320" x2="1084" y2="340" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="988" y="342" width="192" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="1084" y="357" font-size="8.5" fill="#666" text-anchor="middle">Secondary link — back to shop</text>

  <!-- ===== FOOTER ===== -->
  <rect x="20" y="504" width="1160" height="360" fill="#D8D6CF" rx="3" stroke="#BBBAB3" stroke-width="0.8"/>
  <rect x="280" y="512" width="440" height="17" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.5"/>
  <text x="500" y="524" font-size="8.5" fill="#888" text-anchor="middle">Footer — same template as Homepage (wireframe #03)</text>
  <rect x="48" y="548" width="80" height="22" fill="#C0BDB6" rx="2"/>
  <text x="88" y="563" font-size="9" fill="#666" text-anchor="middle">LOGO</text>
  <rect x="48" y="578" width="140" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="48" y="594" width="120" height="10" fill="#C8C5BE" rx="1"/>
  <text x="500" y="556" font-size="9" fill="#777" letter-spacing="3">SHOP</text>
  <rect x="500" y="566" width="80" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="500" y="581" width="72" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="500" y="596" width="50" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="500" y="611" width="66" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="500" y="626" width="80" height="9" fill="#C8C5BE" rx="1"/>
  <text x="740" y="556" font-size="9" fill="#777" letter-spacing="3">HELP</text>
  <rect x="740" y="566" width="50" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="740" y="581" width="36" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="740" y="596" width="60" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="740" y="611" width="55" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="740" y="626" width="55" height="9" fill="#C8C5BE" rx="1"/>
  <text x="980" y="556" font-size="9" fill="#777" letter-spacing="3">NEWSLETTER</text>
  <rect x="980" y="574" width="150" height="28" fill="#C8C5BE" rx="2" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="1055" y="592" font-size="8" fill="#888" text-anchor="middle">your@email.com</text>
  <rect x="1134" y="574" width="46" height="28" fill="#B0ADA6" rx="2" stroke="#999" stroke-width="0.8"/>
  <text x="1157" y="592" font-size="8" fill="#666" text-anchor="middle">JOIN</text>
  <line x1="48" y1="660" x2="1152" y2="660" stroke="#BBBAB3" stroke-width="0.5"/>
  <rect x="48" y="668" width="200" height="9" fill="#C0BDB6" rx="1"/>
  <text x="740" y="698" font-size="8" fill="#BBB" text-anchor="middle">© 2026 NOIR. ALL RIGHTS RESERVED.</text>

  <!-- Chat widget -->
  <circle cx="1160" cy="840" r="18" fill="#D0CEC8" stroke="#AAAAAA" stroke-width="1"/>
  <text x="1160" y="844" font-size="8" fill="#888" text-anchor="middle">chat</text>

  <!-- Bottom label -->
  <line x1="20" y1="878" x2="1180" y2="878" stroke="#CCC" stroke-width="0.5"/>
  <text x="20" y="894" font-size="10" fill="#AAAAAA">Page 13 / Cart — items list + order summary panel + footer</text>
  <text x="1180" y="894" font-size="10" fill="#AAAAAA" text-anchor="end">Breakpoint: Desktop 1440px+</text>
</svg>