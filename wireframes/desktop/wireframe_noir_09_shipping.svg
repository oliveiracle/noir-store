<svg viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg" role="img" font-family="monospace" style="background:#F4F2ED;">
  <title>Wireframe – NOIR Shipping Page</title>
  <rect width="1200" height="920" fill="#F4F2ED"/>
  <text x="20" y="22" font-size="11" fill="#888" letter-spacing="1.5">WIREFRAME — NOIR / SHIPPING PAGE</text>
  <line x1="20" y1="30" x2="1180" y2="30" stroke="#CCC" stroke-width="0.5"/>

  <!-- NAVBAR -->
  <rect x="20" y="42" width="1160" height="52" fill="#E0DDD6" rx="3" stroke="#BBBAB3" stroke-width="0.8"/>
  <rect x="40" y="58" width="70" height="18" fill="#C8C6BF" rx="2"/>
  <text x="75" y="71" font-size="9" fill="#666" text-anchor="middle">LOGO</text>
  <rect x="420" y="60" width="50" height="14" fill="#D8D6CF" rx="2"/>
  <text x="445" y="71" font-size="8" fill="#777" text-anchor="middle">SHOP</text>
  <rect x="485" y="60" width="50" height="14" fill="#D8D6CF" rx="2"/>
  <text x="510" y="71" font-size="8" fill="#777" text-anchor="middle">ABOUT</text>
  <rect x="550" y="60" width="60" height="14" fill="#D8D6CF" rx="2"/>
  <text x="580" y="71" font-size="8" fill="#777" text-anchor="middle">JACKETS</text>
  <rect x="625" y="60" width="70" height="14" fill="#D8D6CF" rx="2"/>
  <text x="660" y="71" font-size="8" fill="#777" text-anchor="middle">TROUSERS</text>
  <rect x="710" y="60" width="85" height="14" fill="#D8D6CF" rx="2"/>
  <text x="752" y="71" font-size="8" fill="#777" text-anchor="middle">ACCESSORIES</text>
  <rect x="1020" y="60" width="70" height="14" fill="#D8D6CF" rx="2"/>
  <text x="1055" y="71" font-size="8" fill="#777" text-anchor="middle">SEARCH</text>
  <circle cx="1115" cy="67" r="8" fill="none" stroke="#AAAAAA" stroke-width="1.2"/>
  <circle cx="1145" cy="67" r="8" fill="none" stroke="#AAAAAA" stroke-width="1.2"/>
  <line x1="20" y1="96" x2="1180" y2="96" stroke="#C8C6BF" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- MAIN CONTENT AREA -->
  <rect x="20" y="100" width="1160" height="780" fill="#E8E6E0" rx="3" stroke="#C0BEB8" stroke-width="0.8"/>

  <!-- Top spacing -->
  <rect x="20" y="100" width="1160" height="78" fill="#E2E0D9" rx="0"/>
  <text x="600" y="143" font-size="8" fill="#BBB" text-anchor="middle">top spacing — no header / page title</text>

  <!-- Shared template note -->
  <rect x="880" y="110" width="290" height="28" fill="#F4F2ED" rx="4" stroke="#BBBAB3" stroke-width="0.8"/>
  <text x="1025" y="122" font-size="8.5" fill="#888" text-anchor="middle">Same editorial template as FAQ page</text>
  <text x="1025" y="133" font-size="8" fill="#AAA" text-anchor="middle">Single-col layout, ~58% width, negative space right</text>

  <!-- Right side empty space -->
  <rect x="848" y="178" width="310" height="560" fill="#E0DDD6" rx="2" stroke="#C8C5BE" stroke-width="0.5" stroke-dasharray="5,4"/>
  <text x="1003" y="455" font-size="9" fill="#BBB" text-anchor="middle">NEGATIVE SPACE</text>
  <text x="1003" y="471" font-size="8" fill="#CCC" text-anchor="middle">Right side empty</text>

  <!-- ============================
       ITEM 1: STANDARD DELIVERY
  ============================= -->
  <line x1="40" y1="178" x2="830" y2="178" stroke="#C0BDB6" stroke-width="0.5"/>
  <rect x="40" y="185" width="380" height="14" fill="#C0BDB6" rx="2"/>
  <text x="230" y="196" font-size="8" fill="#777" text-anchor="middle" letter-spacing="2">STANDARD DELIVERY</text>
  <rect x="40" y="210" width="460" height="12" fill="#CCCAC3" rx="1"/>
  <!-- annotation -->
  <line x1="420" y1="192" x2="520" y2="172" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="522" y="159" width="240" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="642" y="174" font-size="8.5" fill="#666" text-anchor="middle">Section — caps, high letter-spacing, 10px</text>
  <line x1="500" y1="216" x2="560" y2="236" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="562" y="228" width="230" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="677" y="243" font-size="8.5" fill="#666" text-anchor="middle">Description — body light, price highlighted inline</text>

  <!-- ============================
       ITEM 2: EXPRESS DELIVERY
  ============================= -->
  <line x1="40" y1="310" x2="830" y2="310" stroke="#C0BDB6" stroke-width="0.5"/>
  <rect x="40" y="318" width="320" height="14" fill="#C0BDB6" rx="2"/>
  <text x="200" y="329" font-size="8" fill="#777" text-anchor="middle" letter-spacing="2">EXPRESS DELIVERY</text>
  <rect x="40" y="344" width="580" height="12" fill="#CCCAC3" rx="1"/>

  <!-- ============================
       ITEM 3: INTERNATIONAL
  ============================= -->
  <line x1="40" y1="446" x2="830" y2="446" stroke="#C0BDB6" stroke-width="0.5"/>
  <rect x="40" y="454" width="280" height="14" fill="#C0BDB6" rx="2"/>
  <text x="180" y="465" font-size="8" fill="#777" text-anchor="middle" letter-spacing="2">INTERNATIONAL</text>
  <rect x="40" y="480" width="640" height="12" fill="#CCCAC3" rx="1"/>
  <rect x="40" y="498" width="200" height="12" fill="#CCCAC3" rx="1"/>

  <!-- ============================
       ITEM 4: ORDER TRACKING
  ============================= -->
  <line x1="40" y1="580" x2="830" y2="580" stroke="#C0BDB6" stroke-width="0.5"/>
  <rect x="40" y="588" width="300" height="14" fill="#C0BDB6" rx="2"/>
  <text x="190" y="599" font-size="8" fill="#777" text-anchor="middle" letter-spacing="2">ORDER TRACKING</text>
  <rect x="40" y="614" width="660" height="12" fill="#CCCAC3" rx="1"/>
  <rect x="40" y="632" width="180" height="12" fill="#CCCAC3" rx="1"/>

  <!-- spacing cota between items -->
  <line x1="855" y1="310" x2="855" y2="446" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="840" y1="310" x2="870" y2="310" stroke="#AAAAAA" stroke-width="0.8"/>
  <line x1="840" y1="446" x2="870" y2="446" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="862" y="382" font-size="8" fill="#999" transform="rotate(90,862,382)">~136px entre secoes</text>

  <!-- More items hint -->
  <line x1="40" y1="714" x2="830" y2="714" stroke="#C0BDB6" stroke-width="0.5" stroke-dasharray="5,4"/>
  <rect x="40" y="722" width="340" height="14" fill="#C0BDB6" rx="2" opacity="0.5"/>
  <text x="40" y="752" font-size="8" fill="#BBB">more sections continue on scroll (Returns etc.) ↓</text>

  <!-- Chat widget -->
  <circle cx="1160" cy="840" r="18" fill="#D0CEC8" stroke="#AAAAAA" stroke-width="1"/>
  <text x="1160" y="844" font-size="8" fill="#888" text-anchor="middle">chat</text>

  <!-- Bottom label -->
  <line x1="20" y1="898" x2="1180" y2="898" stroke="#CCC" stroke-width="0.5"/>
  <text x="20" y="914" font-size="10" fill="#AAAAAA">Shipping page — same editorial template as FAQ</text>
  <text x="1180" y="914" font-size="10" fill="#AAAAAA" text-anchor="end">Breakpoint: Desktop 1440px+</text>
</svg>