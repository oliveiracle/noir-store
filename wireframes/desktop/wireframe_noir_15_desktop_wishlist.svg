<svg width="1200" height="860" viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" role="img" font-family="monospace" style="background:#F4F2ED;">
  <title>Wireframe – NOIR Desktop / My Wishlist</title>
  <rect width="1200" height="860" fill="#F4F2ED"/>
  <text x="20" y="22" font-size="11" fill="#888" letter-spacing="1.5">WIREFRAME — NOIR / DESKTOP — MY WISHLIST</text>
  <line x1="20" y1="30" x2="1180" y2="30" stroke="#CCC" stroke-width="0.5"/>

  <!-- NAVBAR -->
  <rect x="20" y="42" width="1160" height="52" fill="#E0DDD6" rx="3" stroke="#BBBAB3" stroke-width="0.8"/>
  <rect x="40" y="58" width="70" height="18" fill="#C8C6BF" rx="2"/>
  <text x="75" y="71" font-size="9" fill="#666" text-anchor="middle">LOGO</text>
  <rect x="420" y="60" width="50" height="14" fill="#D8D6CF" rx="2"/>
  <text x="445" y="71" font-size="8" fill="#777" text-anchor="middle">SHOP</text>
  <rect x="485" y="60" width="50" height="14" fill="#D8D6CF" rx="2"/>
  <text x="510" y="71" font-size="8" fill="#777" text-anchor="middle">ABOUT</text>
  <rect x="550" y="60" width="60" height="14" fill="#D8D6CF" rx="2"/>
  <text x="580" y="71" font-size="8" fill="#777" text-anchor="middle">JACKETS</text>
  <rect x="625" y="60" width="70" height="14" fill="#D8D6CF" rx="2"/>
  <text x="660" y="71" font-size="8" fill="#777" text-anchor="middle">TROUSERS</text>
  <rect x="710" y="60" width="85" height="14" fill="#D8D6CF" rx="2"/>
  <text x="752" y="71" font-size="8" fill="#777" text-anchor="middle">ACCESSORIES</text>
  <rect x="1020" y="60" width="70" height="14" fill="#D8D6CF" rx="2"/>
  <text x="1055" y="71" font-size="8" fill="#777" text-anchor="middle">SEARCH</text>
  <!-- account icon with dropdown arrow -->
  <circle cx="1115" cy="67" r="8" fill="none" stroke="#AAAAAA" stroke-width="1.2"/>
  <text x="1122" y="71" font-size="7" fill="#888">▾</text>
  <!-- cart with badge -->
  <circle cx="1155" cy="67" r="8" fill="none" stroke="#AAAAAA" stroke-width="1.2"/>
  <circle cx="1162" cy="60" r="5.5" fill="#777"/>
  <text x="1162" y="64" font-size="5.5" fill="#F4F2ED" text-anchor="middle">2</text>
  <line x1="20" y1="96" x2="1180" y2="96" stroke="#C8C6BF" stroke-width="0.5" stroke-dasharray="4,4"/>
  <!-- annotation: account dropdown -->
  <line x1="1122" y1="71" x2="1160" y2="84" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="1050" y="84" width="130" height="14" fill="#F4F2ED" rx="2" stroke="#CCC" stroke-width="0.5"/>
  <text x="1115" y="94" font-size="7" fill="#666" text-anchor="middle">Account icon + dropdown ▾</text>

  <!-- MAIN CONTENT AREA -->
  <rect x="20" y="100" width="1160" height="720" fill="#E8E6E0" rx="3" stroke="#C0BEB8" stroke-width="0.8"/>

  <!-- Top spacing -->
  <rect x="20" y="100" width="1160" height="80" fill="#E2E0D9"/>
  <text x="600" y="144" font-size="8" fill="#CCC" text-anchor="middle">top spacing — no hero banner</text>

  <!-- Page title: MY WISHLIST -->
  <text x="48" y="212" font-size="10" fill="#888" letter-spacing="3">MY WISHLIST</text>
  <line x1="48" y1="220" x2="280" y2="220" stroke="#BBBAB3" stroke-width="0.5"/>
  <!-- annotation title -->
  <line x1="280" y1="212" x2="340" y2="198" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="342" y="188" width="210" height="20" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.6"/>
  <text x="447" y="199" font-size="8" fill="#666" text-anchor="middle">Page title — caps, letter-spaced, no hero</text>
  <text x="447" y="208" font-size="7.5" fill="#999" text-anchor="middle">Minimal header — content-first layout</text>

  <!-- PRODUCT CARD 1 — only 1 item in wishlist -->
  <rect x="48" y="236" width="330" height="460" fill="#C8C5BE" rx="2" stroke="#AAAAAA" stroke-width="0.7"/>
  <line x1="48" y1="236" x2="378" y2="696" stroke="#BBBAB0" stroke-width="0.5"/>
  <line x1="378" y1="236" x2="48" y2="696" stroke="#BBBAB0" stroke-width="0.5"/>
  <text x="213" y="468" font-size="9" fill="#888" text-anchor="middle">PRODUCT IMAGE</text>
  <text x="213" y="484" font-size="7.5" fill="#999" text-anchor="middle">Editorial photo — same card style as category grid</text>

  <!-- Product info below card -->
  <text x="48" y="716" font-size="9" fill="#444" font-weight="bold">TAILORED SLIM TROUSERS</text>
  <text x="48" y="734" font-size="8.5" fill="#777">€119.99</text>

  <!-- annotations for card -->
  <line x1="378" y1="460" x2="440" y2="440" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="442" y="428" width="240" height="26" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.6"/>
  <text x="562" y="439" font-size="8" fill="#666" text-anchor="middle">Same card component as category page</text>
  <text x="562" y="451" font-size="7.5" fill="#999" text-anchor="middle">Image + product name bold + price below</text>

  <!-- EMPTY SPACE annotation — 3 empty card slots -->
  <rect x="396" y="236" width="330" height="460" fill="#E0DDD6" rx="2" stroke="#C8C5BE" stroke-width="0.5" stroke-dasharray="5,4"/>
  <text x="561" y="468" font-size="8.5" fill="#CCC" text-anchor="middle">EMPTY SLOT</text>
  <text x="561" y="484" font-size="7.5" fill="#D0CECB" text-anchor="middle">no product saved here</text>

  <rect x="744" y="236" width="330" height="460" fill="#E0DDD6" rx="2" stroke="#C8C5BE" stroke-width="0.5" stroke-dasharray="5,4"/>
  <text x="909" y="468" font-size="8.5" fill="#CCC" text-anchor="middle">EMPTY SLOT</text>
  <text x="909" y="484" font-size="7.5" fill="#D0CECB" text-anchor="middle">no product saved here</text>

  <rect x="1092" y="236" width="88" height="460" fill="#E0DDD6" rx="2" stroke="#C8C5BE" stroke-width="0.4" stroke-dasharray="5,4"/>

  <!-- Empty slots annotation -->
  <line x1="561" y1="460" x2="561" y2="420" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="440" y="402" width="242" height="18" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.6"/>
  <text x="561" y="415" font-size="8" fill="#666" text-anchor="middle">Empty grid slots — wishlist has only 1 item saved</text>

  <!-- Grid layout annotation -->
  <line x1="213" y1="236" x2="213" y2="210" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="600" y="716" width="280" height="26" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.6"/>
  <text x="740" y="727" font-size="8" fill="#666" text-anchor="middle">Grid layout: 4 columns — same template as category pages</text>
  <text x="740" y="738" font-size="7.5" fill="#999" text-anchor="middle">Populated cards + empty slots fill remaining columns</text>

  <!-- Large negative space right side annotation -->
  <line x1="909" y1="600" x2="980" y2="580" stroke="#AAAAAA" stroke-width="0.8" stroke-dasharray="3,2"/>
  <rect x="982" y="568" width="190" height="26" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.6"/>
  <text x="1077" y="579" font-size="8" fill="#666" text-anchor="middle">Intentional negative space — consistent</text>
  <text x="1077" y="590" font-size="7.5" fill="#999" text-anchor="middle">with the brand's minimal aesthetic</text>

  <!-- Chat widget -->
  <circle cx="1162" cy="788" r="18" fill="#D0CEC8" stroke="#AAAAAA" stroke-width="1"/>
  <text x="1162" y="792" font-size="8" fill="#888" text-anchor="middle">chat</text>

  <!-- Bottom label -->
  <line x1="20" y1="838" x2="1180" y2="838" stroke="#CCC" stroke-width="0.5"/>
  <text x="20" y="854" font-size="10" fill="#AAAAAA">Page 15 / Desktop — My Wishlist</text>
  <text x="1180" y="854" font-size="10" fill="#AAAAAA" text-anchor="end">Breakpoint: Desktop 1440px+</text>
</svg>