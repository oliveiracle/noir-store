  <rect x="986" y="263" width="190" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="1081" y="278" font-size="8.5" fill="#666" text-anchor="middle">Underline style input — no border</text>

