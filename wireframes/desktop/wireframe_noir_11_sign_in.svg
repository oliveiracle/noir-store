  <line x1="944" y1="108" x2="944" y2="720" stroke="#BBBAB3" stroke-width="0.5" stroke-dasharray="4,4"/>
  <rect x="340" y="100" width="260" height="17" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.5"/>
