  <rect x="980" y="812" width="150" height="28" fill="#C8C5BE" rx="2" stroke="#AAAAAA" stroke-width="0.8"/>
  <text x="1055" y="830" font-size="8" fill="#888" text-anchor="middle">your@email.com</text>
  <rect x="1134" y="812" width="46" height="28" fill="#B0ADA6" rx="2" stroke="#999" stroke-width="0.8"/>
  <text x="1157" y="830" font-size="8" fill="#666" text-anchor="middle">JOIN</text>

  <!-- Footer bottom -->
  <line x1="48" y1="892" x2="1152" y2="892" stroke="#BBBAB3" stroke-width="0.5"/>
  <rect x="48" y="900" width="200" height="9" fill="#C0BDB6" rx="1"/>
  <rect x="980" y="900" width="80" height="9" fill="#C0BDB6" rx="1"/>
  <rect x="1070" y="900" width="60" height="9" fill="#C0BDB6" rx="1"/>

  <!-- Chat widget -->
  <circle cx="1160" cy="958" r="18" fill="#D0CEC8" stroke="#AAAAAA" stroke-width="1"/>
  <text x="1160" y="962" font-size="8" fill="#888" text-anchor="middle">chat</text>

  <!-- Bottom label -->
  <line x1="20" y1="998" x2="1180" y2="998" stroke="#CCC" stroke-width="0.5"/>
  <text x="20" y="1014" font-size="10" fill="#AAAAAA">Sign In page — centred form + footer</text>
  <text x="1180" y="1014" font-size="10" fill="#AAAAAA" text-anchor="end">Breakpoint: Desktop 1440px+</text>
</svg>