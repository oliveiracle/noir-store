  <rect x="848" y="534" width="210" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="953" y="549" font-size="8.5" fill="#666" text-anchor="middle">Secondary links — light weight, muted</text>

  <!-- =====================
       FOOTER
  ===================== -->
  <rect x="20" y="744" width="1160" height="240" fill="#D8D6CF" rx="3" stroke="#BBBAB3" stroke-width="0.8"/>
  <rect x="380" y="750" width="440" height="18" fill="#F4F2ED" rx="3" stroke="#CCC" stroke-width="0.5"/>
