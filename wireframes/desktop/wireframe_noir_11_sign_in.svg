  <rect x="500" y="800" width="80" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="500" y="815" width="72" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="500" y="830" width="50" height="9" fill="#C8C5BE" rx="1"/>

