  <text x="88" y="799" font-size="9" fill="#666" text-anchor="middle">LOGO</text>
  <rect x="48" y="814" width="140" height="10" fill="#C8C5BE" rx="1"/>
  <rect x="48" y="830" width="120" height="10" fill="#C8C5BE" rx="1"/>

