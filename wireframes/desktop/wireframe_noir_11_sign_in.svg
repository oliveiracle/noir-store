<svg width="1200" height="1020" viewBox="0 0 1200 1020" xmlns="http://www.w3.org/2000/svg" role="img" font-family="monospace" style="background:#F4F2ED;">
  <title>Wireframe – NOIR Sign In Page</title>
  <rect width="1200" height="1020" fill="#F4F2ED"/>
