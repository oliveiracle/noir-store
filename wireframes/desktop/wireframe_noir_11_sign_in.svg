  <rect x="732" y="407" width="200" height="22" fill="#F4F2ED" rx="4" stroke="#CCC" stroke-width="0.8"/>
  <text x="832" y="422" font-size="8.5" fill="#666" text-anchor="middle">Checkbox — label caps, letter-spacing</text>

