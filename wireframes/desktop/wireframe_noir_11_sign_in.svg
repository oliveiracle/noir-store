  <rect x="740" y="800" width="50" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="740" y="815" width="36" height="9" fill="#C8C5BE" rx="1"/>
  <rect x="740" y="830" width="60" height="9" fill="#C8C5BE" rx="1"/>

