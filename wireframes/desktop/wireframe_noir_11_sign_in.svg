  <text x="546" y="264" font-size="8" fill="#888" letter-spacing="2">USERNAME OR EMAIL</text>
  <rect x="546" y="272" width="398" height="30" fill="#D8D6CF" rx="2" stroke="#AAAAAA" stroke-width="0.6"/>
