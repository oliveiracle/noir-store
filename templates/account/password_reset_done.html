{% extends "base.html" %}

<!-- Password reset confirmation page — shown after the reset email is sent -->

{% block title %}Check Your Email — NOIR{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <span class="auth-label">NOIR / ACCOUNT</span>
        <h1 class="auth-title">CHECK YOUR EMAIL</h1>
        <!-- Vague message intentionally — avoids confirming whether email exists -->
        <p class="auth-confirm-text">
            If an account exists for that address, you'll receive a reset link shortly.
        </p>
        <div class="auth-links">
            <a href="{% url 'account_login' %}" class="auth-link">← Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
